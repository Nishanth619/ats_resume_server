name: ats_resume_builder
description: "Ats.Ai — AI-powered resume builder with ATS score analysis, auto-tailoring, and professional PDF export."
publish_to: 'none'

version: 1.0.7+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  open_file: ^3.5.11
  dio: ^5.9.2
  path_provider: ^2.1.5
  firebase_auth: ^6.4.0
  go_router: ^17.2.2
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  uuid: ^4.5.1
  http: ^1.2.0
  percent_indicator: ^4.2.3
  google_mobile_ads: ^5.0.0
  pdf: ^3.12.0
  printing: ^5.13.1
  firebase_storage: ^13.3.0
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  share_plus: ^10.0.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  purchases_flutter: ^10.1.1
  permission_handler: ^12.0.1
  purchases_ui_flutter: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "legal/logo_resume_flat.png"
  adaptive_icon_background: "#0099FF"
  adaptive_icon_foreground: "legal/logo_resume_foreground.png"

flutter:
  uses-material-design: true
